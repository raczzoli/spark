<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Spark: EC, PD and battery connections</title>
  <desc id="desc">Three separate wiring examples. ITE EC and PD programming use Pico GP3 to target SDA, GP2 to target SCL, and common ground. PD operations access external SPI flash through the controller's I2C host interface. Battery Analyzer uses Pico GP7 to battery DATA, GP9 to battery CLOCK, and GND to confirmed battery B minus. Battery B plus stays disconnected from Pico. ENE uses its separate EDI wiring guide. Use one target at a time; connector positions depend on the model.</desc>
  <rect x="1" y="1" width="1198" height="518" rx="20" fill="#10161f" stroke="#2b3746" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="30" y="50" fill="#f1f5fb" font-size="31" font-weight="700">Spark</text>
    <text x="30" y="81" fill="#a7b6c9" font-size="18">One app. One Pico. Three workspaces.</text>
    <rect x="887" y="29" width="283" height="39" rx="19" fill="#172d2b" stroke="#2f5b50"/>
    <text x="1028" y="54" fill="#83debf" font-size="16" text-anchor="middle">Choose one target at a time</text>
    <g transform="translate(24 108)">
      <rect width="368" height="337" rx="14" fill="#171f2b" stroke="#30425c"/>
      <rect width="6" height="337" rx="3" fill="#76b8ff"/>
      <text x="24" y="40" fill="#f1f5fb" font-size="24" font-weight="600">EC Programmer</text>
      <text x="24" y="70" fill="#a7b6c9" font-size="15">ITE I²C / DBGR connection</text>
      <text x="24" y="106" fill="#8e9eb3" font-size="13" letter-spacing="1">PICO GPIO</text>
      <text x="240" y="106" fill="#8e9eb3" font-size="13" letter-spacing="1">TARGET EC</text>
      <path d="M106 136 H224" fill="none" stroke="#5ed8bd" stroke-width="3"/>
      <rect x="24" y="118" width="82" height="36" rx="7" fill="#111821" stroke="#5ed8bd"/>
      <text x="65" y="143" fill="#5ed8bd" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">GP3</text>
      <text x="240" y="143" fill="#5ed8bd" font-size="20" font-weight="600">SDA</text>
      <path d="M106 185 H224" fill="none" stroke="#76b8ff" stroke-width="3"/>
      <rect x="24" y="167" width="82" height="36" rx="7" fill="#111821" stroke="#76b8ff"/>
      <text x="65" y="192" fill="#76b8ff" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">GP2</text>
      <text x="240" y="192" fill="#76b8ff" font-size="20" font-weight="600">SCL</text>
      <path d="M106 234 H224" fill="none" stroke="#b4c1d1" stroke-width="3"/>
      <rect x="24" y="216" width="82" height="36" rx="7" fill="#111821" stroke="#b4c1d1"/>
      <text x="65" y="241" fill="#b4c1d1" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">GND</text>
      <text x="240" y="241" fill="#b4c1d1" font-size="20" font-weight="600">GND</text>
      <path d="M24 272 H344" stroke="#30425c"/>
      <text x="24" y="297" fill="#b7c7dc" font-size="14">ENE: use the model's EDI wiring diagram.</text>
      <text x="24" y="319" fill="#8e9eb3" font-size="14">Power the EC from its target board.</text>
    </g>

    <g transform="translate(416 108)">
      <rect width="368" height="337" rx="14" fill="#171f2b" stroke="#49416b"/>
      <rect width="6" height="337" rx="3" fill="#b9a4ff"/>
      <text x="24" y="40" fill="#f1f5fb" font-size="24" font-weight="600">PD Controller</text>
      <text x="24" y="70" fill="#a7b6c9" font-size="15">TI 4CC I²C host connection</text>
      <text x="24" y="106" fill="#8e9eb3" font-size="13" letter-spacing="1">PICO GPIO</text>
      <text x="240" y="106" fill="#8e9eb3" font-size="13" letter-spacing="1">PD HOST</text>
      <path d="M106 136 H224" fill="none" stroke="#5ed8bd" stroke-width="3"/>
      <rect x="24" y="118" width="82" height="36" rx="7" fill="#111821" stroke="#5ed8bd"/>
      <text x="65" y="143" fill="#5ed8bd" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">GP3</text>
      <text x="240" y="143" fill="#5ed8bd" font-size="20" font-weight="600">SDA</text>
      <path d="M106 185 H224" fill="none" stroke="#76b8ff" stroke-width="3"/>
      <rect x="24" y="167" width="82" height="36" rx="7" fill="#111821" stroke="#76b8ff"/>
      <text x="65" y="192" fill="#76b8ff" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">GP2</text>
      <text x="240" y="192" fill="#76b8ff" font-size="20" font-weight="600">SCL</text>
      <path d="M106 234 H224" fill="none" stroke="#b4c1d1" stroke-width="3"/>
      <rect x="24" y="216" width="82" height="36" rx="7" fill="#111821" stroke="#b4c1d1"/>
      <text x="65" y="241" fill="#b4c1d1" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">GND</text>
      <text x="240" y="241" fill="#b4c1d1" font-size="20" font-weight="600">GND</text>
      <path d="M24 272 H344" stroke="#49416b"/>
      <text x="24" y="297" fill="#b7c7dc" font-size="14">Read, write and erase external SPI flash.</text>
      <text x="24" y="319" fill="#8e9eb3" font-size="14">Power the PD from its target board.</text>
    </g>

    <g transform="translate(808 108)">
      <rect width="368" height="337" rx="14" fill="#171f2b" stroke="#2f514b"/>
      <rect width="6" height="337" rx="3" fill="#5ed8bd"/>
      <text x="24" y="40" fill="#f1f5fb" font-size="24" font-weight="600">Battery Analyzer</text>
      <text x="24" y="70" fill="#a7b6c9" font-size="15">SMBus default connection</text>
      <text x="24" y="106" fill="#8e9eb3" font-size="13" letter-spacing="1">PICO GPIO</text>
      <text x="240" y="106" fill="#8e9eb3" font-size="13" letter-spacing="1">BATTERY</text>
      <path d="M106 136 H224" fill="none" stroke="#5ed8bd" stroke-width="3"/>
      <rect x="24" y="118" width="82" height="36" rx="7" fill="#111821" stroke="#5ed8bd"/>
      <text x="65" y="143" fill="#5ed8bd" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">GP7</text>
      <text x="240" y="143" fill="#5ed8bd" font-size="20" font-weight="600">DATA</text>
      <path d="M106 185 H224" fill="none" stroke="#76b8ff" stroke-width="3"/>
      <rect x="24" y="167" width="82" height="36" rx="7" fill="#111821" stroke="#76b8ff"/>
      <text x="65" y="192" fill="#76b8ff" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">GP9</text>
      <text x="240" y="192" fill="#76b8ff" font-size="20" font-weight="600">CLOCK</text>
      <path d="M106 234 H224" fill="none" stroke="#b4c1d1" stroke-width="3"/>
      <rect x="24" y="216" width="82" height="36" rx="7" fill="#111821" stroke="#b4c1d1"/>
      <text x="65" y="241" fill="#b4c1d1" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">GND</text>
      <text x="240" y="241" fill="#b4c1d1" font-size="20" font-weight="600">B− / GND</text>
      <path d="M24 272 H344" stroke="#2f514b"/>
      <text x="24" y="297" fill="#f2bf7c" font-size="14" font-weight="600">B+ stays disconnected from Pico.</text>
      <text x="24" y="319" fill="#8e9eb3" font-size="14">Find the pinout in battery model search.</text>
    </g>
    <text x="30" y="478" fill="#a7b6c9" font-size="15">GPIO numbers shown. Actual connector positions depend on the target.</text>
    <text x="30" y="501" fill="#8e9eb3" font-size="14">3.3 V signals and common ground. Disconnect power before changing the wiring.</text>
  </g>
</svg>
